<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Date Picker UI</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <div class="date-picker">
            <input type="checkbox" id="calendar-toggle" class="date-picker__toggle">

            <div class="date-picker__input-row">
                <input type="text" class="date-picker__input" placeholder="dd / mm / yyyy">
                <label for="calendar-toggle" class="date-picker__button" title="Open calendar">
                    <svg class="date-picker__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
                    </svg>
                </label>
            </div>

            <div class="date-picker__dropdown">
                <div class="date-picker__header">
                    <button class="date-picker__nav-btn" aria-label="Previous month">
                        <svg class="date-picker__nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                        </svg>
                    </button>
                    <span class="date-picker__title">December 2022</span>
                    <button class="date-picker__nav-btn" aria-label="Next month">
                        <svg class="date-picker__nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                        </svg>
                    </button>
                </div>

                <div class="date-picker__day-headers">
                    <span class="date-picker__day-header">S</span>
                    <span class="date-picker__day-header">M</span>
                    <span class="date-picker__day-header">T</span>
                    <span class="date-picker__day-header">W</span>
                    <span class="date-picker__day-header">T</span>
                    <span class="date-picker__day-header">F</span>
                    <span class="date-picker__day-header">S</span>
                </div>

                <div class="date-picker__divider"></div>

                <div class="date-picker__day-grid">
                    <span class="date-picker__day-cell date-picker__day-cell--empty"></span>
                    <span class="date-picker__day-cell date-picker__day-cell--empty"></span>
                    <span class="date-picker__day-cell date-picker__day-cell--empty"></span>
                    <span class="date-picker__day-cell date-picker__day-cell--empty"></span>
                    <span class="date-picker__day-cell">1</span>
                    <span class="date-picker__day-cell">2</span>
                    <span class="date-picker__day-cell date-picker__day-cell--weekend">3</span>

                    <span class="date-picker__day-cell date-picker__day-cell--weekend">4</span>
                    <span class="date-picker__day-cell">5</span>
                    <span class="date-picker__day-cell">6</span>
                    <span class="date-picker__day-cell">7</span>
                    <span class="date-picker__day-cell">8</span>
                    <span class="date-picker__day-cell">9</span>
                    <span class="date-picker__day-cell date-picker__day-cell--weekend">10</span>

                    <span class="date-picker__day-cell date-picker__day-cell--weekend">11</span>
                    <span class="date-picker__day-cell">12</span>
                    <span class="date-picker__day-cell">13</span>
                    <span class="date-picker__day-cell">14</span>
                    <span class="date-picker__day-cell">15</span>
                    <span class="date-picker__day-cell">16</span>
                    <span class="date-picker__day-cell date-picker__day-cell--weekend">17</span>

                    <span class="date-picker__day-cell date-picker__day-cell--weekend">18</span>
                    <span class="date-picker__day-cell">19</span>
                    <span class="date-picker__day-cell">20</span>
                    <span class="date-picker__day-cell">21</span>
                    <span class="date-picker__day-cell">22</span>
                    <span class="date-picker__day-cell">23</span>
                    <span class="date-picker__day-cell date-picker__day-cell--weekend">24</span>

                    <span class="date-picker__day-cell date-picker__day-cell--weekend">25</span>
                    <span class="date-picker__day-cell">26</span>
                    <span class="date-picker__day-cell">27</span>
                    <span class="date-picker__day-cell">28</span>
                    <span class="date-picker__day-cell">29</span>
                    <span class="date-picker__day-cell">30</span>
                    <span
                        class="date-picker__day-cell date-picker__day-cell--weekend date-picker__day-cell--selected">31</span>
                </div>
            </div>
        </div>

        <p class="annotations">
            Click the calendar icon to toggle the dropdown — Pure HTML &amp; CSS, no JavaScript
        </p>

    </body>

    </html>


    <script>

    </script>
</body>

</html>
